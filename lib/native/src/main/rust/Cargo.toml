[package]
name = "drift_native_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "drift_native_rust"
# rlib so the host example can link the engine; the Android build only consumes the static lib.
crate-type = ["staticlib", "rlib"]

[dependencies]
dummy = { path = "../../../../../libnative/dummy" }
jni = "0.21.1"
whisper-rs = "0.16.0"

[dev-dependencies]
hound = "3.5"
